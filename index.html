<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلب مشروب من البوفيه</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 440px;
    }

    .title {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 25px;
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid #007bff;
      background: #ffffff;
      color: #007bff;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: #007bff;
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #007bff;
    }

    textarea {
      resize: vertical;
      height: 70px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background-color: #218838;
    }

    .submit-btn:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }

    .alert {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-danger {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">☕ طلب مشروب من البوفيه</div>

    <div class="tab-buttons">
      <button type="button" class="tab-btn active" id="btn-guest" onclick="switchTab('guest')">ضيف / اجتماع</button>
      <button type="button" class="tab-btn" id="btn-emp" onclick="switchTab('employee')">موظف بالشركة</button>
    </div>

    <form id="orderForm" onsubmit="handleFormSubmit(event)">
      
      <!-- قسم الضيف -->
      <div id="section-guest">
        <div class="form-group">
          <label>اسم الضيف:</label>
          <input type="text" id="guestName" placeholder="الاسم بالكامل">
        </div>

        <div class="form-group">
          <label>اسم الشركة / الجهة:</label>
          <input type="text" id="company" placeholder="اسم الشركة">
        </div>

        <div class="form-group">
          <label>رقم الهاتف:</label>
          <input type="tel" id="phone" placeholder="01xxxxxxxxx">
        </div>
      </div>

      <!-- قسم الموظف -->
      <div id="section-employee" style="display: none;">
        <div class="form-group">
          <label>الرقم الوظيفي (ID):</label>
          <input type="number" id="empId" placeholder="مثال: 1001">
        </div>

        <div class="form-group">
          <label>كلمة السر:</label>
          <input type="password" id="password" placeholder="****">
        </div>
      </div>

      <!-- الحقول المشتركة -->
      <div class="form-group">
        <label>المكان / المكتب:</label>
        <input type="text" id="location" placeholder="مثال: مكتب 204 / غرفة الاجتماعات" required>
      </div>

      <div class="form-group">
        <label>اختر المشروب:</label>
        <select id="drink" required>
          <option value="">-- اختر المشروب --</option>
          <option value="شاي أحمر">شاي أحمر</option>
          <option value="قهوة تركي">قهوة تركي</option>
          <option value="قهوة فرنساوي">قهوة فرنساوي</option>
          <option value="شاي بلبن">شاي بلبن</option>
          <option value="ينسون">ينسون</option>
          <option value="نعناع">نعناع</option>
          <option value="مياه معدنية">مياه معدنية</option>
        </select>
      </div>

      <div class="form-group">
        <label>مستوى السكر:</label>
        <select id="sugar" required>
          <option value="بدون سكر">بدون سكر</option>
          <option value="ع الريحة">ع الريحة</option>
          <option value="مظبوط (1 معلقة)">مظبوط (1 معلقة)</option>
          <option value="زيادة (2 معلقة)">زيادة (2 معلقة)</option>
          <option value="زيادة جداً (3 معالق)">زيادة جداً (3 معالق)</option>
          <option value="خارجي">سكر خارجي</option>
        </select>
      </div>

      <div class="form-group">
        <label>ملاحظات إضافية:</label>
        <textarea id="notes" placeholder="أي تفاصيل خاصة..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">🚀 إرسال الطلب</button>
    </form>

    <div id="alertBox" class="alert"></div>
  </div>

  <script>
    // الرابط المباشر الجديد الخاص بك
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJss_M6rRhppUkKSZeWKzkCWiv-Tio1tzggXwU52Oi_J13Ooki9dX4t0JOlUtv4nYB/exec";

    let currentTab = "guest";

    function switchTab(tab) {
      currentTab = tab;
      const btnGuest = document.getElementById("btn-guest");
      const btnEmp = document.getElementById("btn-emp");
      const secGuest = document.getElementById("section-guest");
      const secEmp = document.getElementById("section-employee");

      if (tab === "guest") {
        btnGuest.classList.add("active");
        btnEmp.classList.remove("active");
        secGuest.style.display = "block";
        secEmp.style.display = "none";
      } else {
        btnEmp.classList.add("active");
        btnGuest.classList.remove("active");
        secGuest.style.display = "none";
        secEmp.style.display = "block";
      }
      hideAlert();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById("submitBtn");
      hideAlert();

      const payload = {
        orderType: currentTab,
        location: document.getElementById("location").value,
        drink: document.getElementById("drink").value,
        sugar: document.getElementById("sugar").value,
        notes: document.getElementById("notes").value,
        guestName: document.getElementById("guestName").value,
        company: document.getElementById("company").value,
        phone: document.getElementById("phone").value,
        empId: document.getElementById("empId").value,
        password: document.getElementById("password").value
      };

      if (currentTab === "employee" && (!payload.empId || !payload.password)) {
        showAlert("يرجى إدخال الرقم الوظيفي وكلمة السر!", "danger");
        return;
      }

      if (currentTab === "guest" && !payload.guestName) {
        showAlert("يرجى إدخال اسم الضيف!", "danger");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "جاري التحقق وإرسال الطلب...";

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 إرسال الطلب";

        if (data.status === "success") {
          let msg = data.message;
          if (currentTab === "employee" && data.remainingBalance !== undefined) {
            msg += ` (الرصيد المتبقي: ${data.remainingBalance})`;
          }
          showAlert(msg, "success");
          document.getElementById("notes").value = "";
        } else if (data.status === "error") {
          showAlert(data.message, "danger");
        }
      })
      .catch(error => {
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 إرسال الطلب";
        showAlert("حدث خطأ أثناء الاتصال بالنظام، يرجى المحاولة لاحقاً.", "danger");
      });
    }

    function showAlert(msg, type) {
      const box = document.getElementById("alertBox");
      box.className = `alert alert-${type}`;
      box.innerText = msg;
      box.style.display = "block";
    }

    function hideAlert() {
      document.getElementById("alertBox").style.display = "none";
    }
  </script>
</body>
</html>
